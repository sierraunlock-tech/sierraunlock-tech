<!DOCTYPE html>
<!--
=====================================================================
SIERRAUNLOCK • LIVE CATALOG — live-services.html (v2.4 • TRIPLE TYPE)
---------------------------------------------------------------------
v2.4 CHANGES:
• Shows ALL THREE upstream catalogs: IMEI + FILE + SERVER services
• Type badges on every card (IMEI / FILE / SERVER)
• Type filter dropdown + deep links (#t=server / #t=file / #g=frp)
• Order form adapts by type:
    - IMEI services  → IMEI (15 digits) required
    - FILE / SERVER  → Order details (username/email/notes) required
• Payment instructions + track link + auto-retry kept from v2.3
OWNER: SIERRAUNLOCK Engineering • Waterloo / Koidu, Sierra Leone
=====================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Unlock Services — SIERRAUNLOCK</title>
<meta name="description" content="Live catalog of IMEI, File and Server services with instant pricing in USD and Leones.">
<style>
  :root{--green:#1EB53A;--blue:#0072C6;--navy:#0b1f33;--ink:#12263a;--bg:#f4f8fb}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
  body{background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
  header h1{font-size:22px;letter-spacing:.5px}
  header a{color:#fff;text-decoration:none;font-weight:600;margin-left:14px}
  .bar{max-width:1100px;margin:18px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap}
  .bar input,.bar select{flex:1;min-width:160px;padding:12px;border:2px solid #d5e3ee;border-radius:10px;font-size:15px}
  .count{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700}
  .grid{max-width:1100px;margin:0 auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #e1ecf4;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(18,38,58,.06)}
  .card h3{font-size:15px;line-height:1.35}
  .grp{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase}
  .tbadge{font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:6px;display:inline-block;width:max-content}
  .t-imei{background:#e0f2ff;color:#0a4a7a}
  .t-file{background:#fff6d6;color:#7a5c00}
  .t-server{background:#f3e8ff;color:#5b21b6}
  .meta{font-size:12.5px;color:#5b7186}
  .price{display:flex;gap:10px;align-items:baseline}
  .price b{color:var(--green);font-size:18px}
  .price span{color:var(--blue);font-weight:700}
  button.order{margin-top:auto;background:var(--green);border:0;color:#fff;font-weight:700;padding:11px;border-radius:10px;cursor:pointer;font-size:14px}
  button.order:hover{background:#179c31}
  .modal{position:fixed;inset:0;background:rgba(11,31,51,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  .box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow-y:auto}
  .box h2{font-size:18px;margin-bottom:6px}
  .box p{font-size:13px;color:#5b7186;margin-bottom:12px}
  .box label{font-size:12.5px;font-weight:700;display:block;margin:8px 0 4px}
  .box input,.box textarea{width:100%;padding:11px;border:2px solid #d5e3ee;border-radius:10px;font-size:15px;font-family:inherit}
  .box textarea{min-height:80px;resize:vertical}
  .row{display:flex;gap:10px;margin-top:16px}
  .row button{flex:1;padding:12px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
  .go{background:var(--green);color:#fff}.cancel{background:#e5edf3;color:var(--ink)}
  .done{background:#e9f9ee;border:2px solid var(--green);border-radius:12px;padding:16px;margin-top:12px;font-size:14px;display:none;line-height:1.6}
  .done a{color:var(--blue);font-weight:700;text-decoration:none}
  .pay-method{padding:10px;background:#f4f8fb;border-radius:10px;margin:6px 0;border-left:4px solid var(--blue)}
  .pay-method .detail{font-family:'Courier New',monospace;font-weight:700;color:var(--blue)}
  .job-id-display{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-family:'Courier New',monospace;font-weight:700;text-align:center;margin:10px 0}
  footer{background:var(--navy);color:#cfe3f5;text-align:center;padding:18px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>SIERRAUNLOCK — Live Services</h1>
  <nav><a href="index.html">Home</a><a href="services.html">Our Services</a></nav>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Search: iPhone, Chimera, Octoplus, UMT…">
  <select id="type">
    <option value="">All types</option>
    <option value="imei">IMEI Services</option>
    <option value="file">File Services</option>
    <option value="server">Server Services</option>
  </select>
  <select id="grp"><option value="">All groups</option></select>
  <div class="count" id="count">Loading…</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="mName"></h2>
    <p id="mMeta"></p>
    <label id="imeiLabel">IMEI (15 digits — dial *#06# to see it)</label>
    <input id="imei" inputmode="numeric" maxlength="15" placeholder="35xxxxxxxxxxxxx">
    <label id="detLabel" style="display:none">Order details (username / email / file link / notes)</label>
    <textarea id="details" style="display:none" placeholder="e.g. tool username, email, or instructions for the server"></textarea>
    <label>Your WhatsApp phone number</label>
    <input id="phone" inputmode="tel" placeholder="+232 75 …">
    <label>Brand / Model (optional)</label>
    <input id="model" placeholder="e.g. Apple iPhone 13">
    <div class="done" id="done"></div>
    <div class="row">
      <button class="cancel" onclick="closeM()">Cancel</button>
      <button class="go" id="send">Submit Order</button>
    </div>
  </div>
</div>

<footer>IT CAN ONLY BE GOD ✦ LEARN BEFORE YOU EARN — sierraunlock.com</footer>

<script>
const API='https://sierraunlock-tech-1-4um3.onrender.com';
const WA='23275908206';
let ALL=[],cur=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* deep links: #g=frp (group) and #t=server (type) */
(function(){
  const mg=(location.hash||'').match(/g=([a-z]+)/i);
  if(mg){
    const key=mg[1].toLowerCase();
    const MAP={
      network:['network','carrier','unlock code','worldwide','at&t','t-mobile','vodafone','orange'],
      frp:['frp','icloud','bypass','activator','ramdisk','passcode','mdm'],
      checks:['check','checker','info'],
      tools:['tool','license','cm2','iapro','iremove','infinity','chimera','octoplus','umt']
    };
    window.__groupFilter=MAP[key]||[key];
  }
  const mt=(location.hash||'').match(/t=([a-z]+)/i);
  if(mt) window.__typeFilter=mt[1].toLowerCase();
})();

async function load(){
  try{
    const r=await fetch(API+'/api/services');
    const j=await r.json();
    if(!j.ok)throw 0;
    ALL=j.services||[];
    document.getElementById('count').textContent=ALL.length+' live services';
    const gs=[...new Set(ALL.map(s=>s.group))].sort();
    document.getElementById('grp').innerHTML='<option value="">All groups</option>'+gs.map(g=>`<option>${esc(g)}</option>`).join('');
    if(window.__typeFilter){
      const sel=document.getElementById('type');
      if([...sel.options].some(o=>o.value===window.__typeFilter)) sel.value=window.__typeFilter;
    }
    if(window.__groupFilter){
      const hit=gs.find(g=>{const gl=g.toLowerCase();return window.__groupFilter.some(k=>gl.includes(k));});
      if(hit)document.getElementById('grp').value=hit;
    }
    render();
  }catch(e){
    if((window.__retries=(window.__retries||0)+1)<=3){
      document.getElementById('count').textContent='Waking server… retry '+window.__retries+'/3';
      setTimeout(load,15000);
    }else{
      document.getElementById('count').innerHTML='Catalog offline — <a href="live-services.html" style="color:#7cc4ff">reload page</a>';
    }
  }
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const g=document.getElementById('grp').value;
  const ty=document.getElementById('type').value;
  const list=ALL.filter(s=>
    (!ty||s.type===ty)&&
    (!g||s.group===g)&&
    (!q||(s.name+' '+s.group).toLowerCase().includes(q))
  ).slice(0,300);
  document.getElementById('grid').innerHTML=list.map(s=>`
    <div class="card">
      <span class="tbadge t-${esc(s.type||'imei')}">${esc((s.type||'imei').toUpperCase())}</span>
      <div class="grp">${esc(s.group)}</div>
      <h3>${esc(s.name)}</h3>
      <div class="meta">ID ${esc(s.id)} • ⏱ ${esc(s.time)||'—'}</div>
      <div class="price"><b>$${s.priceUsd}</b><span>Le ${s.priceSle.toLocaleString()}</span></div>
      <button class="order" onclick='openM(${JSON.stringify(s).split("'").join("&#39;")})'>Order Now</button>
    </div>`).join('')||'<p style="padding:20px">No match found.</p>';
}

function openM(s){
  cur=s;
  document.getElementById('mName').textContent=s.name;
  document.getElementById('mMeta').textContent=`${(s.type||'imei').toUpperCase()} • ${s.group} • $${s.priceUsd} (Le ${s.priceSle.toLocaleString()}) • ${s.time||'—'}`;
  const isImei=(s.type||'imei')==='imei';
  document.getElementById('imeiLabel').style.display=isImei?'block':'none';
  document.getElementById('imei').style.display=isImei?'block':'none';
  document.getElementById('detLabel').style.display=isImei?'none':'block';
  document.getElementById('details').style.display=isImei?'none':'block';
  document.getElementById('done').style.display='none';
  document.getElementById('modal').classList.add('open');
}
function closeM(){document.getElementById('modal').classList.remove('open');}

document.getElementById('q').addEventListener('input',render);
document.getElementById('grp').addEventListener('change',render);
document.getElementById('type').addEventListener('change',render);

document.getElementById('send').onclick=async()=>{
  const type=(cur&&cur.type)||'imei';
  const imei=document.getElementById('imei').value.trim();
  const details=document.getElementById('details').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const model=document.getElementById('model').value.trim();
  if(type==='imei' && !/^\d{15}$/.test(imei)){alert('IMEI must be exactly 15 digits.');return;}
  if(type!=='imei' && details.length<3){alert('Please enter the order details (username / email / notes).');return;}
  if(phone.length<9){alert('Enter a valid WhatsApp number.');return;}
  const brand=(model.split(' ')[0]||'Phone');
  const btn=document.getElementById('send');
  btn.disabled=true; btn.textContent='Submitting…';
  try{
    const r=await fetch(API+'/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,imei,details,brand,model,phone,serviceId:cur.id,serviceName:cur.name})});
    const j=await r.json();
    if(j.ok){
      const jobId=j.job;
      const msg=encodeURIComponent(`SIERRAUNLOCK order ${jobId}: ${cur.name} (ID ${cur.id}) — ${type==='imei'?('IMEI '+imei):('Details: '+details)}. I have completed payment.`);
      const d=document.getElementById('done');
      d.style.display='block';
      d.innerHTML=
        `<b>✅ Order <span style="color:var(--green)">${esc(jobId)}</span> received!</b>`+
        `<div class="job-id-display">📋 Your Job ID: ${esc(jobId)}</div>`+
        `<b>💳 PAYMENT INSTRUCTIONS:</b>`+
        `<div class="pay-method">🟠 <b>Orange Money</b><br><span class="detail">+232 75 908 206</span></div>`+
        `<div class="pay-method">🟡 <b>Binance Pay</b> (auto-detect)<br><span class="detail">ID: 754378475</span><br><small>Note: "${esc(jobId)}"</small></div>`+
        `<div class="pay-method">💵 <b>Cash</b><br><small>Waterloo or Koidu hub</small></div>`+
        `📍 <a href="track.html?id=${encodeURIComponent(jobId)}" target="_blank">Track your order live →</a><br>`+
        `💬 <a target="_blank" href="https://wa.me/${WA}?text=${msg}">Confirm payment on WhatsApp →</a>`;
    }else{alert('Order failed: '+(j.error||'try again'));}
  }catch(e){alert('Network error: '+(e.message||'try again'));}
  btn.disabled=false; btn.textContent='Submit Order';
};
load();
</script>
</body>
</html>
