    (wholesale cost is a business secret — never shown here)

  • Open the page with a pre-selected group via deep links:

  • Click "Order Now" → enter IMEI + WhatsApp → submit order

HOW IT WORKS:
1. Page loads → fetches /api/services from the Render backend
2. Backend calls FastUnlockers GSM Hub API (imeiservicelist action)
3. Backend flattens the nested reply + applies the founder profit
   formula (wholesale cost + $2 flat; cost hidden from public)
4. This page renders cards with $ price + Le price + BUY button
5. Customer clicks Order Now → modal opens → enters IMEI + phone
6. Form submits to /api/unlock → job created with status "queued"
   and payment_status = "unpaid"
7. Payment instructions shown → customer pays via OM/Binance/cash
8. Founder opens admin-orders.html → confirms payment → auto-fulfil
9. Result/code returned to customer via track.html + WhatsApp

DEEP-LINK GROUP FILTER:
The Services mega-menu (main.js v9.4) links here with #g= hashes.
On load, the page reads the hash and pre-selects the matching group
in the filter dropdown so customers land exactly where they clicked.

AUTO-RETRY LOGIC:
Render free tier sleeps after inactivity; first wake takes ~50 s.
This page auto-retries up to 3 times (every 15 s) showing
"Waking server… retry X/3", then offers a friendly reload link.

SECURITY & PRIVACY:

• Only job ID + IMEI + phone are submitted; no permanent storage
• Money safety: upstream orders require the founder admin token;
  customers can never trigger spending on Alhassan's balance
• Payments go to SIERRAUNLOCK desks first (Orange Money / Binance /
  cash); refunds are founder-only after fraud review (site policy)

ACCESS:

• Founders: admin-orders.html by direct URL + admin token
• Linked: Services mega-menu on every page (main.js v9.4)

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Unlock Services — SIERRAUNLOCK</title>
<meta name="description" content="Live catalog of 248+ unlock, IMEI check, bypass and tool-license services with instant pricing in USD and Leones.">
<style>
  :root{--green:#1EB53A;--blue:#0072C6;--navy:#0b1f33;--ink:#12263a;--bg:#f4f8fb}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
  body{background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
  header h1{font-size:22px;letter-spacing:.5px}
  header a{color:#fff;text-decoration:none;font-weight:600;margin-left:14px}
  .bar{max-width:1100px;margin:18px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap}
  .bar input,.bar select{flex:1;min-width:200px;padding:12px;border:2px solid #d5e3ee;border-radius:10px;font-size:15px}
  .count{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700}
  .grid{max-width:1100px;margin:0 auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #e1ecf4;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(18,38,58,.06)}
  .card h3{font-size:15px;line-height:1.35}
  .grp{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase}
  .meta{font-size:12.5px;color:#5b7186}
  .price{display:flex;gap:10px;align-items:baseline}
  .price b{color:var(--green);font-size:18px}
  .price span{color:var(--blue);font-weight:700}
  button.order{margin-top:auto;background:var(--green);border:0;color:#fff;font-weight:700;padding:11px;border-radius:10px;cursor:pointer;font-size:14px}
  button.order:hover{background:#179c31}
  .modal{position:fixed;inset:0;background:rgba(11,31,51,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.open{display:flex}
  .box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow-y:auto}
  .box h2{font-size:18px;margin-bottom:6px}
  .box p{font-size:13px;color:#5b7186;margin-bottom:12px}
  .box label{font-size:12.5px;font-weight:700;display:block;margin:8px 0 4px}
  .box input{width:100%;padding:11px;border:2px solid #d5e3ee;border-radius:10px;font-size:15px}
  .row{display:flex;gap:10px;margin-top:16px}
  .row button{flex:1;padding:12px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
  .go{background:var(--green);color:#fff}.cancel{background:#e5edf3;color:var(--ink)}
  .done{background:#e9f9ee;border:2px solid var(--green);border-radius:12px;padding:16px;margin-top:12px;font-size:14px;display:none;line-height:1.6}
  .done a{color:var(--blue);font-weight:700;text-decoration:none}
  .done a:hover{text-decoration:underline}
  .pay-method{padding:12px;background:#f4f8fb;border-radius:10px;margin:6px 0;border-left:4px solid var(--blue)}
  .pay-method b{color:var(--navy)}
  .pay-method .detail{font-family:'Courier New',monospace;font-weight:700;color:var(--blue);font-size:14px}
  .pay-note{background:#fff6d6;border:1px solid #ffb020;border-radius:8px;padding:10px;font-size:12.5px;margin-top:8px;color:#7a5c00}
  .job-id-display{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:1px;text-align:center;margin:10px 0;font-size:15px}
  footer{background:var(--navy);color:#cfe3f5;text-align:center;padding:18px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>SIERRAUNLOCK — Live Services</h1>
  <nav><a href="index.html">Home</a><a href="services.html">Our Services</a></nav>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Search: iPhone, AT&T, FRP, Xiaomi…">
  <select id="grp"><option value="">All groups</option></select>
  <div class="count" id="count">Loading…</div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="mName"></h2>
    <p id="mMeta"></p>
    <label>IMEI (15 digits — dial *#06# to see it)</label>
    <input id="imei" inputmode="numeric" maxlength="15" placeholder="35xxxxxxxxxxxxx">
    <label>Your WhatsApp phone number</label>
    <input id="phone" inputmode="tel" placeholder="+232 75 …">
    <label>Brand / Model (optional)</label>
    <input id="model" placeholder="e.g. Apple iPhone 13">
    <div class="done" id="done"></div>
    <div class="row">
      <button class="cancel" onclick="closeM()">Cancel</button>
      <button class="go" id="send">Submit Order</button>
    </div>
  </div>
</div>

<footer>IT CAN ONLY BE GOD ✦ LEARN BEFORE YOU EARN — sierraunlock.com</footer>

<script>
const API='https://sierraunlock-tech-1-4um3.onrender.com';
const WA='23275908206';
let ALL=[],cur=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* DEEP-LINK GROUP FILTER — reads #g=network / #g=frp / #g=checks / #g=tools
   from the URL (sent by the Services mega-menu) and pre-selects the matching
   group once the catalog finishes loading. */
(function(){
  const m=(location.hash||'').match(/g=([a-z]+)/i);
  if(!m)return;
  const key=m[1].toLowerCase();
  const MAP={
    network:['network','carrier','unlock code','worldwide','at&t','t-mobile','vodafone','orange'],
    frp:['frp','icloud','bypass','activator','ramdisk','passcode','mdm'],
    checks:['check','checker','info'],
    tools:['tool','license','cm2','iapro','iremove','infinity']
  };
  window.__groupFilter=MAP[key]||[key];
})();

async function load(){
  try{
    const r=await fetch(API+'/api/services');
    const j=await r.json();
    if(!j.ok)throw 0;
    ALL=j.services||[];
    document.getElementById('count').textContent=ALL.length+' live services';
    const gs=[...new Set(ALL.map(s=>s.group))].sort();
    document.getElementById('grp').innerHTML='<option value="">All groups</option>'+gs.map(g=>`<option>${esc(g)}</option>`).join('');
    if(window.__groupFilter){
      const hit=gs.find(g=>{const gl=g.toLowerCase();return window.__groupFilter.some(k=>gl.includes(k));});
      if(hit)document.getElementById('grp').value=hit;
    }
    render();
  }catch(e){
    if((window.__retries=(window.__retries||0)+1)<=3){
      document.getElementById('count').textContent='Waking server… retry '+window.__retries+'/3';
      setTimeout(load,15000);
    }else{
      document.getElementById('count').innerHTML='Catalog offline — <a href="live-services.html" style="color:#7cc4ff">reload page</a>';
    }
  }
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const g=document.getElementById('grp').value;
  const list=ALL.filter(s=>(!g||s.group===g)&&(!q||(s.name+' '+s.group).toLowerCase().includes(q))).slice(0,300);
  document.getElementById('grid').innerHTML=list.map(s=>`
    <div class="card">
      <div class="grp">${esc(s.group)}</div>
      <h3>${esc(s.name)}</h3>
      <div class="meta">ID ${esc(s.id)} • ⏱ ${esc(s.time)||'—'}</div>
      <div class="price"><b>$${s.priceUsd}</b><span>Le ${s.priceSle.toLocaleString()}</span></div>
      <button class="order" onclick='openM(${JSON.stringify(s).split("'").join("&#39;")})'>Order Now</button>
    </div>`).join('')||'<p style="padding:20px">No match found.</p>';
}

function openM(s){
  cur=s;
  document.getElementById('mName').textContent=s.name;
  document.getElementById('mMeta').textContent=`Group: ${s.group} • Price: $${s.priceUsd} (Le ${s.priceSle.toLocaleString()}) • Time: ${s.time||'—'}`;
  document.getElementById('done').style.display='none';
  document.getElementById('modal').classList.add('open');
}

function closeM(){
  document.getElementById('modal').classList.remove('open');
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('grp').addEventListener('change',render);

document.getElementById('send').onclick=async()=>{
  const imei=document.getElementById('imei').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const model=document.getElementById('model').value.trim();
  if(!/^\d{15}$/.test(imei)){alert('IMEI must be exactly 15 digits.');return;}
  if(phone.length<9){alert('Enter a valid WhatsApp number.');return;}
  const brand=(model.split(' ')[0]||'Phone');

  const btn = document.getElementById('send');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try{
    const r=await fetch(API+'/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imei,brand,model,phone,serviceId:cur.id,serviceName:cur.name})});
    const j=await r.json();
    if(j.ok){
      const jobId = j.job;
      const msg=encodeURIComponent(`SIERRAUNLOCK order ${jobId}: ${cur.name} (ID ${cur.id}) — IMEI ${imei}. I have completed payment.`);
      const d=document.getElementById('done');
      d.style.display='block';
      d.innerHTML=
        `<b>✅ Order <span style="color:var(--green)">${esc(jobId)}</span> received!</b><br><br>`+

        `<div class="job-id-display">📋 Your Job ID: ${esc(jobId)}</div>`+
        `<div class="pay-note">⚠️ <b>Include this Job ID in your Binance payment note</b> for automatic processing.</div><br>`+

        `<b>💳 PAYMENT INSTRUCTIONS:</b><br>`+
        `<div class="pay-method">`+
          `🟠 <b>Orange Money</b><br>`+
          `<span class="detail">+232 75 908 206</span><br>`+
          `<small>Name: Alhassan Mansaray</small>`+
        `</div>`+
        `<div class="pay-method">`+
          `🟡 <b>Binance Pay</b> <small>(auto-detect)</small><br>`+
          `<span class="detail">ID: 754378475</span><br>`+
          `<small>Note: "${esc(jobId)}" — auto-fulfils in ~30 seconds</small>`+
        `</div>`+
        `<div class="pay-method">`+
          `💵 <b>Cash</b><br>`+
          `<small>Visit Waterloo hub (Tombo Park) or Koidu hub</small>`+
        `</div><br>`+

        `<div style="display:flex;flex-direction:column;gap:8px">`+
          `📍 <a href="track.html?id=${encodeURIComponent(jobId)}" target="_blank">Track your order live →</a>`+
          `💬 <a target="_blank" href="https://wa.me/${WA}?text=${msg}">Confirm payment on WhatsApp →</a>`+
        `</div>`;
    }else{
      alert('Order failed: '+(j.error||'try again'));
    }
  }catch(e){
    alert('Network error: '+(e.message||'try again'));
  }finally{
    btn.disabled = false;
    btn.textContent = 'Submit Order';
  }
};

load();
</script>
</body>
</html>
